services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Hoangky123@
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Hoangky123@" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/kynhungvanlaky-max}/gamestore-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus_api
    restart: unless-stopped
    ports:
      - "5021:5021"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./MediaStorage:/app/MediaStorage
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5021
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GameStoreDB;User Id=sa;Password=Hoangky123@;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Jwt__Issuer=http://localhost:5021
      - Jwt__Audience=http://localhost:5205

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/kynhungvanlaky-max}/gamestore-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "5205:5205"
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5205
      - ApiSettings__BaseUrl=http://api:5021/
      - SignalR__HubUrl=http://localhost:5021/hubs/nexus

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/kynhungvanlaky-max}/gamestore-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexus_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:3001
      - ApiSettings__BaseUrl=http://api:5021/
      - AppSettings__FrontendBaseUrl=http://localhost:5205

  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - api

volumes:
  sqlserver_data:
