services:
  nexuskeys-api:
    container_name: nexuskeys-api
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${DOCKER_USERNAME:-nexus}/gamestore-api:latest
    ports:
      - "127.0.0.1:5021:5021"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5021
    networks:
      - nexuskeys-net
    restart: unless-stopped

  nexuskeys-storefront:
    container_name: nexuskeys-storefront
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${DOCKER_USERNAME:-nexus}/gamestore-frontend:latest
    ports:
      - "127.0.0.1:5205:5205"
    depends_on:
      - nexuskeys-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5205
      - ApiSettings__BaseUrl=http://nexuskeys-api:5021/
      - SignalR__HubUrl=http://localhost:5021/hubs/nexus
      - AdminPortal__BaseUrl=http://localhost:3001
    networks:
      - nexuskeys-net
    restart: unless-stopped

  nexuskeys-admin:
    container_name: nexuskeys-admin
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKER_USERNAME:-nexus}/gamestore-backend:latest
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - nexuskeys-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:3001
      - ApiSettings__BaseUrl=http://nexuskeys-api:5021/
      - AppSettings__FrontendBaseUrl=http://localhost:5205
    networks:
      - nexuskeys-net
    restart: unless-stopped

  nexuskeys-nginx:
    image: nginx:alpine
    container_name: nexuskeys-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexuskeys-storefront
      - nexuskeys-admin
      - nexuskeys-api
    networks:
      - nexuskeys-net

networks:
  nexuskeys-net:
    driver: bridge
