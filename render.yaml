databases:
  - name: gamestore-db
    databaseName: gamestore
    user: postgres
    plan: free

services:
  # 1. API Service
  - type: web
    name: nexuskeys-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: gamestore-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true

  # 2. Storefront (Web Khách hàng)
  - type: web
    name: nexuskeys-storefront
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiSettings__BaseUrl
        fromService:
          type: web
          name: nexuskeys-api
          property: host

  # 3. Admin Portal (Trang Quản trị)
  - type: web
    name: nexuskeys-admin
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiSettings__BaseUrl
        fromService:
          type: web
          name: nexuskeys-api
          property: host
